[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["semana2", "tests"]
addopts = """
--cov=semana2
--cov=app
--cov-report=term-missing
--cov-fail-under=80
"""

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true