services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://sensor:secret@db:5432/sensorhub
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sensor
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: sensorhub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensor -d sensorhub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: